[package]
name = "valv"
version = "2.0.0"
edition = "2021"
rust-version = "1.81"
authors = ["Damon", "TITAN Softwork Solutions"]
description = "Valv: Encrypted macro + runtime framework for compile-time string encryption"
repository = "https://github.com/TITAN-Softwork-Solutions/Regera"
readme = "README.md"
keywords = ["crypto", "encryption", "macros", "framework"]
categories = ["cryptography", "development-tools"]
license = "AGPL-3.0-only"
exclude = ["/target", "**/target", ".gitignore", ".vscode", ".github"]

[workspace]
members = ["valv_core", "valv_macros", "valv_spec"]
resolver = "2"

[features]
default = ["std", "chacha", "timing_guard"]
std = ["valv_core/std"]
leaky_reveal = ["valv_core/leaky_reveal"]
timing_guard = ["std", "valv_core/timing_guard"]
runtime_bound = ["valv_core/runtime_bound", "valv_macros/runtime_bound"]
chacha = ["valv_core/chacha", "valv_macros/chacha"]
ascon = ["valv_core/ascon", "valv_macros/ascon"]
aesgcm = ["valv_core/aesgcm", "valv_macros/aesgcm"]
xormask = ["valv_core/xormask", "valv_macros/xormask"]
streammask = ["valv_core/streammask", "valv_macros/streammask"]

[dependencies]
valv_core = { version = "2.0.0", path = "./valv_core", default-features = false }
valv_macros = { version = "2.0.0", path = "./valv_macros" }

[dev-dependencies]
valv_core = { version = "2.0.0", path = "./valv_core", default-features = false, features = ["std", "chacha", "ascon", "aesgcm", "xormask", "streammask"] }

[package.metadata.docs.rs]
all-features = true

[lib]
path = "./lib.rs"

[profile.release]
opt-level = 3
debug = false
lto = true
panic = "abort"
