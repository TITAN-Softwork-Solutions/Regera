[package]
name = "regera_core"
version = "0.1.0"
edition = "2021"

[features]
default = ["std"]
std = []
leaky_reveal = []
jesko = ["dep:rand", "dep:blake3", "dep:chacha20", "dep:subtle"]
absolut = ["dep:rand", "dep:blake3", "dep:subtle", "dep:tiny-keccak", "dep:ascon-aead"]
sadair = ["dep:rand", "dep:blake3", "dep:subtle", "dep:aes-gcm"]
gamera = []
velar = ["dep:rand", "dep:blake3", "dep:chacha20"]

[dependencies]
rand = { version = "0.8", optional = true }
blake3 = { version = "1", optional = true }
chacha20 = { version = "0.9", optional = true }
zeroize = "1.8.1"
aes-gcm = { version = "0.10", features = ["aes"], optional = true }
tiny-keccak = { version = "2.0", features = ["kmac"], optional = true }
ascon-aead = { version = "0.5.1", optional = true }
subtle = { version = "2.6.1", optional = true }
