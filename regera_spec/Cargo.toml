[package]
name = "regera_spec"
version = "0.1.0"
edition = "2024"

[[test]]
name = "regera_spec"
path = "integration/spec.rs"

[dependencies]
regera = { path = "../", default-features = false, features = ["std", "jesko", "absolut", "sadair", "gamera", "velar"] }

[profile.release]
opt-level = 3
debug = false
lto = true
panic = "abort"
