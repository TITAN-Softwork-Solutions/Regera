[package]
name = "valv_core"
version = "2.0.0"
edition = "2021"
rust-version = "1.81"
authors = ["Damon", "TITAN Softwork Solutions"]
description = "Runtime types and encryption engines for Valv compile-time string protection"
repository = "https://github.com/TITAN-Softwork-Solutions/Regera"
license = "AGPL-3.0-only"
keywords = ["crypto", "encryption", "strings"]
categories = ["cryptography", "development-tools"]

[features]
default = ["std"]
std = []
leaky_reveal = []
timing_guard = ["std"]
runtime_bound = ["dep:blake3", "dep:aes-gcm"]
chacha = ["dep:rand", "dep:blake3", "dep:chacha20", "dep:subtle"]
ascon = ["dep:rand", "dep:blake3", "dep:subtle", "dep:tiny-keccak", "dep:ascon-aead"]
aesgcm = ["dep:rand", "dep:blake3", "dep:subtle", "dep:aes-gcm"]
xormask = []
streammask = ["dep:rand", "dep:blake3", "dep:chacha20"]

[dependencies]
rand = { version = "0.8", optional = true }
blake3 = { version = "1", optional = true }
chacha20 = { version = "0.9", optional = true }
zeroize = "1.8.1"
aes-gcm = { version = "0.10", features = ["aes", "zeroize"], optional = true }
tiny-keccak = { version = "2.0", features = ["kmac"], optional = true }
ascon-aead = { version = "0.5.1", optional = true }
subtle = { version = "2.6.1", optional = true }
